<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dziennik Jow | Jasin, Osin, Wrona</title>
  
  <!-- Czcionka Inter & Ikony FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Plik ze stylami CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Połączenie z Firebase (Baza Danych w Chmurze) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // LINK DO TWOJEJ BAZY FIREBASE
    const firebaseConfig = {
      databaseURL: "https://dziennik-jow-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    // TAJNY PIN DLA EKIPY
    const SECRET_PIN = "132027";

    // Inicjalizacja Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const entriesRef = ref(db, 'entries');

    let currentRating = 7;
    let selectedAuthor = 'Jasin';
    let selectedCategory = 'Cytaty';
    let entries = [];

    // Sprawdzanie logowania po załadowaniu
    window.addEventListener('DOMContentLoaded', () => {
      checkAuthStatus();
      initStars();
      initAuthorSelector();
      initCategorySelector();

      document.getElementById('loginForm').addEventListener('submit', handleLogin);
      document.getElementById('logoutBtn').addEventListener('click', handleLogout);
      document.getElementById('entryForm').addEventListener('submit', handleFormSubmit);
      document.getElementById('authorFilter').addEventListener('change', renderEntries);
      document.getElementById('categoryFilter').addEventListener('change', renderEntries);

      // Nasłuchiwanie zmian w bazie danych
      onValue(entriesRef, (snapshot) => {
        const data = snapshot.val();
        entries = [];
        if (data) {
          Object.keys(data).forEach(key => {
            entries.push({
              firebaseKey: key,
              ...data[key]
            });
          });
          entries.sort((a, b) => new Date(b.date) - new Date(a.date));
        }
        renderEntries();
        updateStreak();
      });
    });

    function checkAuthStatus() {
      const isLogged = localStorage.getItem('jow_is_logged') === 'true';
      if (isLogged) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
      } else {
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('appContent').style.display = 'none';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const pinInput = document.getElementById('pinInput').value.trim();
      const errorMsg = document.getElementById('loginError');

      if (pinInput === SECRET_PIN) {
        localStorage.setItem('jow_is_logged', 'true');
        errorMsg.style.display = 'none';
        document.getElementById('pinInput').value = '';
        checkAuthStatus();
      } else {
        errorMsg.style.display = 'block';
        document.getElementById('pinInput').value = '';
      }
    }

    function handleLogout() {
      localStorage.removeItem('jow_is_logged');
      checkAuthStatus();
    }

    function initStars() {
      const container = document.getElementById('starsContainer');
      container.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const star = document.createElement('i');
        star.className = i <= currentRating ? 'fa-solid fa-star star-icon' : 'fa-regular fa-star star-icon empty';
        star.addEventListener('click', () => setRating(i));
        container.appendChild(star);
      }
    }

    function setRating(val) {
      currentRating = val;
      document.getElementById('ratingValue').innerText = `${val} / 10`;
      initStars();
    }

    function initAuthorSelector() {
      const btns = document.querySelectorAll('.author-btn');
      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          btns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedAuthor = btn.getAttribute('data-author');
        });
      });
    }

    function initCategorySelector() {
      const btns = document.querySelectorAll('.category-btn');
      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          btns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedCategory = btn.getAttribute('data-category');
          updateFormPlaceholders();
        });
      });
    }

    function updateFormPlaceholders() {
      const mainInputLabel = document.getElementById('mainInputLabel');
      const quoteInput = document.getElementById('quoteInput');
      const lessonInput = document.getElementById('lessonInput');

      if (selectedCategory === 'Cytaty') {
        mainInputLabel.innerText = "Cytat z dzisiejszego dnia";
        quoteInput.placeholder = "Co ciekawego/śmiesznego dzisiaj padło?";
        lessonInput.placeholder = "Czego się dzisiaj nauczyłeś lub co wyciągasz z tego dnia?";
      } else if (selectedCategory === 'Wspomnienia') {
        mainInputLabel.innerText = "Tytuł / Nazwa wspomnienia";
        quoteInput.placeholder = "Co wspominać będziemy na lata? (np. Epicki wyjazd)";
        lessonInput.placeholder = "Opisz to wspomnienie ze szczegółami...";
      } else {
        mainInputLabel.innerText = "Co się dziś wydarzyło?";
        quoteInput.placeholder = "Podsumuj dzisiejszy dzień jednym zdaniem...";
        lessonInput.placeholder = "Napisz co dokładnie dzisiaj robiłeś/robiła ekipa...";
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const quote = document.getElementById('quoteInput').value.trim();
      const lesson = document.getElementById('lessonInput').value.trim();

      if (!quote || !lesson) return;

      const newEntry = {
        date: new Date().toISOString(),
        author: selectedAuthor,
        category: selectedCategory,
        quote: quote,
        lesson: lesson,
        rating: currentRating,
        reactions: {},
        comments: []
      };

      push(entriesRef, newEntry);

      document.getElementById('quoteInput').value = '';
      document.getElementById('lessonInput').value = '';
      setRating(7);
    }

    window.deleteEntry = function(key) {
      if (confirm('Czy na pewno chcesz usunąć ten wpis?')) {
        const itemRef = ref(db, `entries/${key}`);
        remove(itemRef);
      }
    }

    window.toggleReaction = function(key, emoji) {
      const entry = entries.find(e => e.firebaseKey === key);
      if (!entry) return;

      let reactions = entry.reactions || {};
      if (!reactions[emoji]) {
        reactions[emoji] = [];
      }

      const userIndex = reactions[emoji].indexOf(selectedAuthor);
      if (userIndex > -1) {
        reactions[emoji].splice(userIndex, 1);
      } else {
        reactions[emoji].push(selectedAuthor);
      }

      const itemRef = ref(db, `entries/${key}`);
      update(itemRef, { reactions: reactions });
    }

    window.addComment = function(e, key) {
      e.preventDefault();
      const input = document.getElementById(`commentInput-${key}`);
      const authorSelect = document.getElementById(`commentAuthor-${key}`);
      const text = input.value.trim();
      const author = authorSelect.value;

      if (!text) return;

      const entry = entries.find(e => e.firebaseKey === key);
      if (!entry) return;

      const comments = entry.comments || [];
      comments.push({
        id: Date.now(),
        author: author,
        text: text,
        date: new Date().toISOString()
      });

      const itemRef = ref(db, `entries/${key}`);
      update(itemRef, { comments: comments });
      input.value = '';
    }

    window.deleteComment = function(entryKey, commentId) {
      const entry = entries.find(e => e.firebaseKey === entryKey);
      if (!entry || !entry.comments) return;

      if (confirm('Usunąć ten komentarz?')) {
        const updatedComments = entry.comments.filter(c => c.id !== commentId);
        const itemRef = ref(db, `entries/${entryKey}`);
        update(itemRef, { comments: updatedComments });
      }
    }

    function updateStreak() {
      const streakBadge = document.getElementById('streakBadge');
      const streakCount = document.getElementById('streakCount');
      const streakLabel = document.getElementById('streakLabel');

      if (entries.length === 0) {
        streakBadge.className = 'streak-badge inactive';
        streakCount.innerText = '0 DNI';
        streakLabel.innerText = 'Dodaj pierwszy wpis!';
        return;
      }

      const dates = entries.map(e => {
        const d = new Date(e.date);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      });

      const uniqueDates = Array.from(new Set(dates)).sort().reverse();
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth() + 1).padStart(2, '0')}-${String(yesterday.getDate()).padStart(2, '0')}`;

      const hasToday = uniqueDates.includes(todayStr);
      const hasYesterday = uniqueDates.includes(yesterdayStr);

      let streak = 0;

      if (hasToday || hasYesterday) {
        let checkDate = hasToday ? new Date(today) : new Date(yesterday);
        while (true) {
          const checkStr = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;
          if (uniqueDates.includes(checkStr)) {
            streak++;
            checkDate.setDate(checkDate.getDate() - 1);
          } else {
            break;
          }
        }
      }

      streakCount.innerText = `${streak} ${streak === 1 ? 'DZIEŃ' : 'DNI'}`;

      if (hasToday) {
        streakBadge.className = 'streak-badge active';
        streakLabel.innerText = 'Dziś passa zaliczona! 🔥';
      } else if (streak > 0) {
        streakBadge.className = 'streak-badge pending';
        streakLabel.innerText = 'Utrzymaj passę dzisiaj!';
      } else {
        streakBadge.className = 'streak-badge inactive';
        streakLabel.innerText = 'Passa wygasła. Zacznij dziś!';
      }
    }

    function renderEntries() {
      const authorFilterVal = document.getElementById('authorFilter').value;
      const categoryFilterVal = document.getElementById('categoryFilter').value;

      let filtered = entries;

      if (authorFilterVal !== 'ALL') {
        filtered = filtered.filter(e => e.author === authorFilterVal);
      }

      if (categoryFilterVal !== 'ALL') {
        filtered = filtered.filter(e => (e.category || 'Cytaty') === categoryFilterVal);
      }

      document.getElementById('totalEntries').innerText = entries.length;
      if (entries.length > 0) {
        const sum = entries.reduce((acc, curr) => acc + curr.rating, 0);
        document.getElementById('avgRating').innerText = (sum / entries.length).toFixed(1);
      } else {
        document.getElementById('avgRating').innerText = '0.0';
      }

      const listContainer = document.getElementById('entriesList');
      listContainer.innerHTML = '';

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-box-open"></i>
            <p>Brak wpisów dla wybranych filtrów.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const d = new Date(item.date);
        const dateFormatted = d.toLocaleDateString('pl-PL', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });

        const category = item.category || 'Cytaty';
        const reactions = item.reactions || {};
        const comments = item.comments || [];
        const availableEmojis = ['🔥', '😂', '💪', '❤️', '👍'];

        let categoryIcon = 'fa-quote-left';
        if (category === 'Wspomnienia') categoryIcon = 'fa-camera-retro';
        if (category === 'Co się dziś wydarzyło?') categoryIcon = 'fa-calendar-day';

        let reactionsHTML = '';
        availableEmojis.forEach(emoji => {
          const users = reactions[emoji] || [];
          const count = users.length;
          const isActive = users.includes(selectedAuthor);

          reactionsHTML += `
            <button onclick="toggleReaction('${item.firebaseKey}', '${emoji}')" 
                    class="reaction-btn ${isActive ? 'active' : ''}" 
                    title="${count > 0 ? 'Dali: ' + users.join(', ') : 'Dodaj reakcję'}">
              ${emoji} <span class="reaction-count">${count}</span>
            </button>
          `;
        });

        let commentsHTML = '';
        comments.forEach(c => {
          commentsHTML += `
            <div class="comment-item">
              <div class="comment-content">
                <span class="comment-author author-${c.author.toLowerCase()}">${c.author}:</span>
                <span class="comment-text">${c.text}</span>
              </div>
              <button onclick="deleteComment('${item.firebaseKey}', ${c.id})" class="comment-delete-btn" title="Usuń komentarz">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          `;
        });

        const entryCard = document.createElement('div');
        entryCard.className = `entry-card author-border-${item.author.toLowerCase()}`;

        entryCard.innerHTML = `
          <div class="entry-header">
            <div class="entry-meta">
              <span class="badge author-${item.author.toLowerCase()}">${item.author}</span>
              <span class="category-badge"><i class="fa-solid ${categoryIcon}"></i> ${category}</span>
              <span class="entry-date"><i class="fa-regular fa-calendar"></i> ${dateFormatted}</span>
            </div>
            <div class="entry-actions">
              <span class="entry-score"><i class="fa-solid fa-star"></i> ${item.rating}/10</span>
              <button onclick="deleteEntry('${item.firebaseKey}')" class="delete-btn" title="Usuń wpis">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
          
          <div class="entry-content">
            <div class="entry-quote">
              <i class="fa-solid ${categoryIcon} quote-icon"></i>
              <span>"${item.quote}"</span>
            </div>
            
            <div class="entry-lesson">
              <div class="lesson-title"><i class="fa-solid fa-align-left"></i> ${category === 'Cytaty' ? 'Nauka na przyszłość:' : 'Szczegóły / Opis:'}</div>
              <p>${item.lesson}</p>
            </div>

            <!-- SEKCJA REAKCJI -->
            <div class="reactions-bar">
              ${reactionsHTML}
            </div>

            <!-- SEKCJA KOMENTARZY -->
            <div class="comments-section">
              <div class="comments-title"><i class="fa-solid fa-comments"></i> Komentarze (${comments.length})</div>
              <div class="comments-list">
                ${commentsHTML || '<p class="no-comments">Brak komentarzy. Bądź pierwszy!</p>'}
              </div>
              <form onsubmit="addComment(event, '${item.firebaseKey}')" class="comment-form">
                <select id="commentAuthor-${item.firebaseKey}" class="comment-author-select">
                  <option value="Jasin" ${selectedAuthor === 'Jasin' ? 'selected' : ''}>Jasin</option>
                  <option value="Osin" ${selectedAuthor === 'Osin' ? 'selected' : ''}>Osin</option>
                  <option value="Wrona" ${selectedAuthor === 'Wrona' ? 'selected' : ''}>Wrona</option>
                </select>
                <input type="text" id="commentInput-${item.firebaseKey}" class="comment-input" placeholder="Napisz komentarz..." required>
                <button type="submit" class="comment-submit-btn"><i class="fa-solid fa-paper-plane"></i></button>
              </form>
            </div>

          </div>
        `;

        listContainer.appendChild(entryCard);
      });
    }
  </script>
</head>
<body>

  <!-- EKRAN LOGOWANIA -->
  <div id="loginOverlay" class="login-overlay">
    <div class="card login-card">
      <div class="login-header">
        <i class="fa-solid fa-lock login-lock-icon"></i>
        <h2>Dziennik Jow</h2>
        <p>Wpisz kod PIN, aby uzyskać dostęp</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <input type="password" id="pinInput" class="form-control pin-input" placeholder="Wpisz PIN..." maxlength="10" required>
        </div>
        <p id="loginError" class="login-error">Błędny kod PIN! Spróbuj ponownie.</p>
        <button type="submit" class="submit-btn"><i class="fa-solid fa-key"></i> Zaloguj się</button>
      </form>
    </div>
  </div>

  <!-- ZAWARTOŚĆ STRONY -->
  <div id="appContent" style="display: none;">
    <header class="main-header">
      <div class="container header-container">
        <div class="logo-area">
          <div class="logo-icon"><i class="fa-solid fa-journal-whills"></i></div>
          <div>
            <h1 class="logo-title">Dziennik Jow</h1>
            <p class="logo-subtitle">Jasin • Osin • Wrona</p>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 15px;">
          <div class="streak-badge" id="streakBadge">
            <div class="streak-icon" id="streakIcon">
              <i class="fa-solid fa-fire"></i>
            </div>
            <div class="streak-info">
              <div class="streak-count" id="streakCount">0 DNI</div>
              <div class="streak-label" id="streakLabel">Brak aktywnej passy</div>
            </div>
          </div>
          <button id="logoutBtn" class="logout-btn" title="Wyloguj"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </div>
    </header>

    <main class="container main-layout">
      <section class="card form-card">
        <h2 class="section-title"><i class="fa-solid fa-pen-to-square"></i> Dodaj wpis z dzisiaj</h2>
        
        <form id="entryForm">
          <div class="form-group">
            <label class="form-label">Kto dodaje wpis?</label>
            <div class="author-selector">
              <button type="button" class="author-btn active" data-author="Jasin">
                <i class="fa-solid fa-user"></i> Jasin
              </button>
              <button type="button" class="author-btn" data-author="Osin">
                <i class="fa-solid fa-user"></i> Osin
              </button>
              <button type="button" class="author-btn" data-author="Wrona">
                <i class="fa-solid fa-user"></i> Wrona
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Kategoria wpisu</label>
            <div class="category-selector">
              <button type="button" class="category-btn active" data-category="Cytaty">
                <i class="fa-solid fa-quote-left"></i> Cytaty
              </button>
              <button type="button" class="category-btn" data-category="Wspomnienia">
                <i class="fa-solid fa-camera-retro"></i> Wspomnienia
